$kind: collection
name: 'Web Movie AI - Full API'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
variables:
  - key: base_url
    value: 'http://localhost:8000/api'
  - key: token
    value: ''
  - key: movie_id
    value: '1'
  - key: comment_id
    value: '1'
  - key: user_id
    value: '1'
  - key: genre_id
    value: '1'
  - key: transaction_id
    value: '1'
  - key: category_id
    value: '1'
  - key: package_id
    value: '1'
