$kind: http-request
name: Get Revenue Stats
method: GET
url: '{{base_url}}/admin/dashboard/revenue'
queryParams:
  - key: from
    value: '2024-01-01'
  - key: to
    value: '2024-12-31'
  - key: period
    value: 'monthly'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
