$kind: http-request
name: Admin Create Movie
method: POST
url: '{{base_url}}/admin/movies'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: |-
    {
      "tmdb_id": 12345,
      "title": "Avengers: Endgame",
      "is_premium": false,
      "is_pinned": false
    }
