$kind: http-request
name: Admin Change User Role
method: PATCH
url: '{{base_url}}/admin/users/{{user_id}}/role'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: |-
    {
      "role": "user"
    }
description: |
  Phân quyền hệ thống only: "user" | "admin".
  Không dùng role "vip" — quyền xem phim theo subscription plan.
