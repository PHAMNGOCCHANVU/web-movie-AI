$kind: http-request
name: Get Current User
method: GET
url: '{{base_url}}/auth/me'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
description: |
  Response gồm role (user|admin) và subscription:
  { plan_code, status, starts_at, expires_at }
  Free: plan_code null, status none.
