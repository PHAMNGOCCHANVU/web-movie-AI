$kind: http-request
name: Create VNPay Payment - Upgrade to VIP
method: POST
url: '{{base_url}}/payment/vnpay/create'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: |-
    {
      "plan_code": "vip",
      "transaction_type": "upgrade"
    }
description: |
  Standard user nâng cấp VIP: thanh toán TOÀN BỘ giá gói VIP (full price).
  Không trừ số tiền/ngày còn lại của Standard.
  Khi IPN success: ghi đè subscription sang VIP, chu kỳ mới từ thời điểm kích hoạt.
