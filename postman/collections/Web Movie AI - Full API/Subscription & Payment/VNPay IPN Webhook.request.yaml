$kind: http-request
name: VNPay IPN Webhook
method: POST
url: '{{base_url}}/payment/vnpay/ipn'
description: |
  Idempotent: khi success, kích hoạt subscription (plan_code, starts_at, expires_at).
  Upgrade VIP ghi đè gói Standard, chu kỳ mới từ thời điểm kích hoạt.
body:
  type: json
  content: |-
    {
      "vnp_ResponseCode": "00",
      "vnp_TxnRef": "TXN123456",
      "vnp_Amount": "10000000",
      "vnp_SecureHash": "hash_value_here"
    }
