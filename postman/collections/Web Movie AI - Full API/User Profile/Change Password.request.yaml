$kind: http-request
name: Change Password
method: PUT
url: '{{base_url}}/user/change-password'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: |-
    {
      "current_password": "oldpassword123",
      "password": "newpassword123",
      "password_confirmation": "newpassword123"
    }
