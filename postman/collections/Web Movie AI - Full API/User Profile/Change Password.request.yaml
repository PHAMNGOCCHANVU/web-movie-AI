$kind: http-request
name: Change Password
method: PUT
url: '{{base_url}}/user/change-password'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: |-
    {
      "current_password": "{{test_password}}",
      "password": "NewPassword123!",
      "password_confirmation": "NewPassword123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Change Password - Status 200 or 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 422]);
      });

      pm.test("Change Password - Response has message", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
      });
