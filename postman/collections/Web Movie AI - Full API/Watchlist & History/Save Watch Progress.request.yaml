$kind: http-request
name: Save Watch Progress
method: POST
url: '{{base_url}}/user/watch-history'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: |-
    {
      "movie_id": {{test_movie_id}},
      "episode_id": 1,
      "progress": 120,
      "duration": 3600
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Save Watch Progress - Status 200 or 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("Save Watch Progress - Response has data", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("data");
      });
